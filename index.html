<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İki Sayı Arasındaki Fark</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    padding:20px;
    background:#eef2f5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:100%;
    max-width:470px;
    background:#fff;
    border-radius:18px;
    padding:26px;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
    display:flex;
    flex-direction:column;
}

h2{
    margin:0 0 18px 0;
    text-align:center;
    font-size:20px;
    color:#2c3e50;
}

.input-group{
    margin-bottom:14px;
}

label{
    display:block;
    margin-bottom:6px;
    font-size:13px;
    color:#6b7a90;
    font-weight:500;
}

.field-container{
    display:flex;
    gap:8px;
    align-items:center;
}

input{
    width:100%;
    height:46px;
    border:1.5px solid #c9d2dc;
    border-radius:8px;
    font-size:15px;
    text-align:center;
    transition:.15s;
}

input:focus{
    outline:none;
    border-color:#8fd4ae;
    box-shadow:0 0 0 4px rgba(143,212,174,0.35);
}

.clear-btn{
    width:46px;
    min-width:46px;
    height:46px;
    border-radius:8px;
    background:#3498db;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

/* BUTTONS */
.button-row{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.main-btn{
    flex:1;
    height:46px;
    border:1.5px solid #c9d2dc;
    border-radius:8px;
    background:#fff;
    font-weight:600;
    cursor:pointer;
    transition:.15s;
}

.main-btn.active{
    border-color:#8fd4ae;
    box-shadow:0 0 0 4px rgba(143,212,174,0.45);
}

.reset-btn{
    width:46px;
    min-width:46px;
    height:46px;
    border-radius:8px;
    border:1.5px solid #c9d2dc;
    background:#fff;
    cursor:pointer;
    font-size:18px;
    transition:.15s;
}

.reset-btn.active{
    border-color:#e74c3c;
    box-shadow:0 0 0 4px rgba(231,76,60,0.35);
}

/* RESULT */
.result{
    display:none;
    margin-top:18px;
    background:#f7fbf9;
    padding:15px;
    border-radius:10px;
}

.result p{
    margin:8px 0;
    font-weight:600;
    color:#2c3e50;
}

.highlight{
    float:right;
    font-weight:700;
}

.footer{
    margin-top:auto;
    text-align:center;
    font-size:12px;
    color:#9aa6b2;
    padding-top:15px;
}

</style>
</head>

<body>

<div class="container">

<h2>İki Sayı Arasındaki Fark</h2>

<div class="input-group">
<label>1. Sayı</label>
<div class="field-container">

<input id="sayi1"
inputmode="decimal"
oninput="resetUI()"
onkeydown="enter(1,event)">

<div class="clear-btn" onclick="temizle('sayi1')">×</div>

</div>
</div>

<div class="input-group">
<label>2. Sayı</label>
<div class="field-container">

<input id="sayi2"
inputmode="decimal"
oninput="resetUI()"
onkeydown="enter(2,event)">

<div class="clear-btn" onclick="temizle('sayi2')">×</div>

</div>
</div>

<div class="button-row">
    <button class="main-btn" id="hesaplaBtn" onclick="hesapla()">Hesapla</button>
    <button class="reset-btn" onclick="resetle(event)">↺</button>
</div>

<div class="result" id="sonuc">

<p>
1. Sayı
<span class="highlight" id="r1">0,00</span>
</p>

<p>
2. Sayı
<span class="highlight" id="r2">0,00</span>
</p>

<p>
Fark
<span class="highlight" id="rf">0,00</span>
</p>

<p>
Yüzde
<span class="highlight" id="ry">%0,00</span>
</p>

</div>

<div class="footer">Created by Fatih Mersin</div>

</div>

<script>

// ENTER
function enter(i,e){
    if(e.key==="Enter"){
        e.preventDefault();
        if(i===1){
            document.getElementById("sayi2").focus();
        }else{
            hesapla();
        }
    }
}

// CLEAR
function temizle(id){
    document.getElementById(id).value="";
    resetUI();
    setTimeout(()=>document.getElementById(id).focus(),10);
}

// PARSE
function p(v){
    return parseFloat(v.trim().replace(/\./g,"").replace(",", ".")) || 0;
}

// HESAPLA
function hesapla(){

    document.getElementById("hesaplaBtn").classList.add("active");

    let a = p(document.getElementById("sayi1").value);
    let b = p(document.getElementById("sayi2").value);

    let fark = b - a;
    let yuzde = a !== 0 ? (fark/Math.abs(a))*100 : 0;

    let opt = {minimumFractionDigits:2,maximumFractionDigits:2};

    document.getElementById("r1").innerText = a.toLocaleString('tr-TR',opt);
    document.getElementById("r2").innerText = b.toLocaleString('tr-TR',opt);

    document.getElementById("rf").innerText =
        (fark>0?"+":"") + fark.toLocaleString('tr-TR',opt);

    document.getElementById("ry").innerText =
        (yuzde>0?"+":"") + yuzde.toLocaleString('tr-TR',opt) + "%";

    document.getElementById("sonuc").style.display="block";
}

// RESET UI
function resetUI(){
    document.getElementById("hesaplaBtn").classList.remove("active");
    document.getElementById("resetBtn")?.classList?.remove?.("active");
    document.querySelector(".reset-btn").classList.remove("active");
    document.getElementById("sonuc").style.display="none";
}

// RESET
function resetle(e){

    e.preventDefault();

    document.querySelectorAll("input").forEach(i=>i.value="");

    resetUI();

    document.querySelector(".reset-btn").classList.add("active");
}

</script>

</body>
</html>
